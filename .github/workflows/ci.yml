name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Parallel execution: lint and test run simultaneously
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Lint code
        run: npm run lint

      - name: Fail if lint auto-fixed anything
        run: git diff --exit-code

      - name: Type check
        run: npm run check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Run tests
        run: npm run test

  python-test:
    name: python-test (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [hot-theme-detection]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements.txt

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: python -m pytest -q

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test, python-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Build applications
        run: npm run build

  frontend-image-build:
    name: Frontend Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile -t blue-star-frontend:ci .

  backend-image-smoke:
    name: Backend Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: blue_star_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile -t blue-star-backend:ci .

      - name: Boot backend and wait for health
        run: |
          docker run -d --name backend --network host \
            -e NODE_ENV=production -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_USERNAME=postgres -e DB_PASSWORD=postgres -e DB_DATABASE=blue_star_smoke -e DB_SSL=false \
            -e SEC_EDGAR_CONTACT_EMAIL=ci@example.com -e FINANCIAL_MODELING_PREP_API_KEY=ci-dummy \
            -e NTFY_BASE_URL=http://127.0.0.1:9 \
            blue-star-backend:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' backend)" = "true" ] || break
            sleep 2
          done
          docker logs backend
          exit 1

      - name: Assert Python dependencies import
        run: docker exec backend python3 -c "import yfinance, bs4, requests, pandas, numpy"

      - name: Assert migrations ran
        run: |
          count=$(PGPASSWORD=postgres psql -h localhost -U postgres -d blue_star_smoke -tAc "select count(*) from migrations")
          echo "migrations applied: $count"
          [ "$count" -gt 0 ]
