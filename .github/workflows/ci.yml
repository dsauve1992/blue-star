name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'

jobs:
  # Parallel execution: lint and test run simultaneously
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: blue_star_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests
        run: npm run test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: blue_star_test_db
          DB_SSL: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build applications
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            apps/backend/dist
            apps/frontend/dist
          retention-days: 7
          compression-level: 6

  backend-image-smoke:
    name: Backend Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: blue_star_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile -t blue-star-backend:ci .

      - name: Boot backend and wait for health
        run: |
          docker run -d --name backend --network host \
            -e NODE_ENV=production -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_USERNAME=postgres -e DB_PASSWORD=postgres -e DB_DATABASE=blue_star_smoke -e DB_SSL=false \
            -e FINNHUB_API_KEY=ci-dummy -e FINANCIAL_MODELING_PREP_API_KEY=ci-dummy \
            -e NTFY_BASE_URL=http://127.0.0.1:9 \
            blue-star-backend:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' backend)" = "true" ] || break
            sleep 2
          done
          docker logs backend
          exit 1

      - name: Assert migrations ran
        run: |
          count=$(PGPASSWORD=postgres psql -h localhost -U postgres -d blue_star_smoke -tAc "select count(*) from migrations")
          echo "migrations applied: $count"
          [ "$count" -gt 0 ]
